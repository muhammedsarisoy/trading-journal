name: CodeQL

# Kod içi güvenlik desenlerini arar: enjeksiyon, doğrulanmamış girdi,
# yanlış kripto kullanımı gibi. Bağımlılık taramasından farklı bir katman.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analiz (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
